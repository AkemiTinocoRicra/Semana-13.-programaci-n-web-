<nav class="navbar navbar-expand navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" routerLink="/personas">Personas</a>

    @if (mostrarSesion()) {
      @if (auth.estaAutenticado()) {
        <div class="navbar-nav">
          <a
            class="nav-link"
            routerLink="/personas"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            Listado
          </a>
          <a class="nav-link" routerLink="/personas/nuevo" routerLinkActive="active">
            Nueva persona
          </a>
        </div>

        <div class="d-flex align-items-center gap-3 ms-auto">
          <span class="navbar-text small text-truncate">{{ auth.usuarioActual() }}</span>
          <button type="button" class="btn btn-outline-light btn-sm" (click)="cerrarSesion()">
            Cerrar sesión
          </button>
        </div>
      } @else {
        <div class="navbar-nav ms-auto">
          <a class="nav-link" routerLink="/login" routerLinkActive="active">Iniciar sesión</a>
          <a class="nav-link" routerLink="/registro" routerLinkActive="active">Registrarse</a>
        </div>
      }
    }
  </div>
</nav>

<main class="container py-4">
  <router-outlet />
</main>
